<svg width="100%" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Effect -->
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .terminal-title {
      font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 500;
      font-size: 13px;
      fill: #94a3b8;
    }
    .code-text {
      font-family: 'Fira Code', 'Cascadia Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13.5px;
      line-height: 1.5;
    }
    .bracket { fill: #f8fafc; font-weight: 700; }
    .key { fill: #38bdf8; font-weight: 600; }
    .val-string { fill: #4ade80; }
    .val-array { fill: #facc15; }
    .punct { fill: #94a3b8; }
  </style>

  <!-- Container Box with Rounded Corners matching Header Banner -->
  <rect x="2" y="2" width="896" height="276" rx="16" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.5" />

  <!-- Terminal Window Header Bar -->
  <path d="M 2 18 C 2 9.16 9.16 2 18 2 L 882 2 C 890.84 2 898 9.16 898 18 L 898 38 L 2 38 Z" fill="#0b1120" />
  <line x1="2" y1="38" x2="898" y2="38" stroke="#334155" stroke-width="1" />

  <!-- Terminal Window Dots -->
  <circle cx="24" cy="20" r="5" fill="#ef4444" />
  <circle cx="40" cy="20" r="5" fill="#eab308" />
  <circle cx="56" cy="20" r="5" fill="#22c55e" />

  <!-- Terminal Header Title -->
  <text x="82" y="24" class="terminal-title">aditthan@dev-machine: ~/about_developer.json</text>

  <!-- JSON Code Lines -->
  <g class="code-text" transform="translate(30, 62)">
    <!-- Line 1: { -->
    <text x="0" y="0" class="bracket">{</text>

    <!-- Line 2: "developer": "Aditthan J K", -->
    <text x="24" y="22">
      <tspan class="key">"developer"</tspan><tspan class="punct">: </tspan><tspan class="val-string">"Aditthan J K"</tspan><tspan class="punct">,</tspan>
    </text>

    <!-- Line 3: "status": "Pre-Final Year Undergrad (AI & ML)", -->
    <text x="24" y="44">
      <tspan class="key">"status"</tspan><tspan class="punct">: </tspan><tspan class="val-string">"Pre-Final Year Undergrad (AI &amp; ML)"</tspan><tspan class="punct">,</tspan>
    </text>

    <!-- Line 4: "focus_areas": [ "Deep Learning", "Computer Vision", "Time-Series Forecasting" ], -->
    <text x="24" y="66">
      <tspan class="key">"focus_areas"</tspan><tspan class="punct">: [ </tspan><tspan class="val-array">"Deep Learning"</tspan><tspan class="punct">, </tspan><tspan class="val-array">"Computer Vision"</tspan><tspan class="punct">, </tspan><tspan class="val-array">"Time-Series Forecasting"</tspan><tspan class="punct"> ],</tspan>
    </text>

    <!-- Line 5: "current_endeavors": [ "Agentic AI Frameworks", "Quantitative Modeling", "Scalable ML Pipelines" ], -->
    <text x="24" y="88">
      <tspan class="key">"current_endeavors"</tspan><tspan class="punct">: [ </tspan><tspan class="val-array">"Agentic AI Frameworks"</tspan><tspan class="punct">, </tspan><tspan class="val-array">"Quantitative Systems"</tspan><tspan class="punct">, </tspan><tspan class="val-array">"Data Systems"</tspan><tspan class="punct"> ],</tspan>
    </text>

    <!-- Line 6: "philosophy": "Built for Engineering, Wired for Business.", -->
    <text x="24" y="110">
      <tspan class="key">"philosophy"</tspan><tspan class="punct">: </tspan><tspan class="val-string">"Built for Engineering, Wired for Business."</tspan><tspan class="punct">,</tspan>
    </text>

    <!-- Line 7: "contact": "aditthanjeganathan067@gmail.com" -->
    <text x="24" y="132">
      <tspan class="key">"contact"</tspan><tspan class="punct">: </tspan><tspan class="val-string">"aditthanjeganathan067@gmail.com"</tspan>
    </text>

    <!-- Line 8: } -->
    <text x="0" y="154" class="bracket">}</text>
  </g>

  <!-- Glowing Corner Circuit Graphic -->
  <circle cx="820" cy="200" r="80" fill="url(#cardGlow)" />
  <path d="M 780 180 L 860 180 M 780 210 L 860 210 M 780 240 L 860 240" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1.5" />
  <path d="M 800 160 L 800 260 M 835 160 L 835 260" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1.5" />
</svg>
