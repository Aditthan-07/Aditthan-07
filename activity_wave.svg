<svg width="100%" height="180" viewBox="0 0 900 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="waveCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Primary Wave Area Gradient -->
    <linearGradient id="waveArea1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Secondary Wave Area Gradient -->
    <linearGradient id="waveArea2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ee787" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7ee787" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="pointGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .header-text {
      font-family: 'Fira Code', ui-monospace, monospace;
      font-size: 11.5px;
      fill: #8b949e;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .axis-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      fill: #6e7681;
      font-weight: 500;
    }
    @keyframes nodePulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.4); opacity: 1; }
    }
    .node-anim {
      transform-origin: center;
      animation: nodePulse 3s infinite ease-in-out;
    }
  </style>

  <!-- Container Frame matching Obsidian Theme -->
  <rect x="1" y="1" width="898" height="178" rx="14" fill="url(#waveCardBg)" stroke="#30363d" stroke-width="1" />

  <!-- Card Header Bar -->
  <text x="28" y="28" class="header-text">📈 Activity &amp; Contribution Wave — Aditthan-07</text>

  <!-- Horizontal Grid Reference Lines -->
  <line x1="28" y1="52" x2="872" y2="52" stroke="#21262d" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="28" y1="88" x2="872" y2="88" stroke="#21262d" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="28" y1="124" x2="872" y2="124" stroke="#21262d" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Secondary Background Wavy Area (Mint Green) -->
  <path d="M 28 140 
           C 100 130, 160 110, 230 115 
           C 300 120, 360 85,  430 90 
           C 500 95,  560 65,  630 75 
           C 700 85,  770 50,  872 60 
           L 872 145 L 28 145 Z" 
        fill="url(#waveArea2)" />
  <path d="M 28 140 
           C 100 130, 160 110, 230 115 
           C 300 120, 360 85,  430 90 
           C 500 95,  560 65,  630 75 
           C 700 85,  770 50,  872 60" 
        stroke="#7ee787" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="4 3" />

  <!-- Primary Foreground Wavy Area (Sky Blue) -->
  <path d="M 28 145 
           C 90 135,  150 95,  220 100 
           C 290 105, 350 60,  420 65 
           C 490 70,  550 42,  620 48 
           C 690 54,  760 35,  872 40 
           L 872 145 L 28 145 Z" 
        fill="url(#waveArea1)" />
  <path d="M 28 145 
           C 90 135,  150 95,  220 100 
           C 290 105, 350 60,  420 65 
           C 490 70,  550 42,  620 48 
           C 690 54,  760 35,  872 40" 
        stroke="#58a6ff" stroke-width="2.5" />

  <!-- Glowing Activity Peak Nodes -->
  <circle cx="220" cy="100" r="4" fill="#58a6ff" filter="url(#pointGlow)" />
  <circle cx="420" cy="65"  r="4.5" fill="#58a6ff" filter="url(#pointGlow)" />
  <circle cx="620" cy="48"  r="5" fill="#58a6ff" filter="url(#pointGlow)" />
  <circle cx="872" cy="40"  r="5.5" fill="#58a6ff" filter="url(#pointGlow)" />

  <!-- Month Axis Markers across 900px width -->
  <text x="35"  y="160" class="axis-text">Jan</text>
  <text x="110" y="160" class="axis-text">Feb</text>
  <text x="185" y="160" class="axis-text">Mar</text>
  <text x="260" y="160" class="axis-text">Apr</text>
  <text x="335" y="160" class="axis-text">May</text>
  <text x="410" y="160" class="axis-text">Jun</text>
  <text x="485" y="160" class="axis-text">Jul</text>
  <text x="560" y="160" class="axis-text">Aug</text>
  <text x="635" y="160" class="axis-text">Sep</text>
  <text x="710" y="160" class="axis-text">Oct</text>
  <text x="785" y="160" class="axis-text">Nov</text>
  <text x="850" y="160" class="axis-text">Dec</text>
</svg>
