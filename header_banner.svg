<svg width="100%" height="130" viewBox="0 0 900 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Effect -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .header-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 34px;
      fill: #f8fafc;
      letter-spacing: -0.5px;
    }
    .header-sub {
      font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
      letter-spacing: 0.4px;
    }
    .header-tag {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      font-size: 12px;
      fill: #94a3b8;
    }
  </style>

  <!-- Container Box with Rounded Corners -->
  <rect x="2" y="2" width="896" height="126" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Background Decorative Glowing Accents -->
  <circle cx="820" cy="65" r="100" fill="url(#glowGrad)" />

  <!-- Terminal Window Dots -->
  <circle cx="35" cy="28" r="5" fill="#ef4444" />
  <circle cx="51" cy="28" r="5" fill="#eab308" />
  <circle cx="67" cy="28" r="5" fill="#22c55e" />

  <!-- Grid Accent Lines -->
  <path d="M 760 30 L 860 30 M 760 55 L 860 55 M 760 80 L 860 80 M 760 105 L 860 105" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1.5" />
  <path d="M 780 15 L 780 115 M 815 15 L 815 115 M 850 15 L 850 115" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Title Text -->
  <text x="35" y="68" class="header-title">Hi, I'm Aditthan J K 👋</text>

  <!-- Subtitle -->
  <text x="35" y="94" class="header-sub">&gt; AI &amp; ML Student • Deep Learning • Computer Vision</text>

  <!-- Bottom Tagline -->
  <text x="35" y="114" class="header-tag">Built for Engineering, Wired for Business.</text>
</svg>
