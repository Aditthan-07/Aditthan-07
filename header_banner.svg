<svg width="100%" height="130" viewBox="0 0 900 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Obsidian Matte Background Gradient -->
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Glassmorphism Hairline Border -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="ambientGlow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-weight: 700;
      font-size: 32px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 14px;
      fill: #8b949e;
      letter-spacing: 0.2px;
    }
    .tag {
      font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 500;
      font-size: 12px;
      fill: #58a6ff;
      letter-spacing: 0.3px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 11px;
      fill: #58a6ff;
    }
  </style>

  <!-- Container Box with Rounded Glass Corners -->
  <rect x="1" y="1" width="898" height="128" rx="14" fill="url(#obsidianBg)" stroke="url(#glassBorder)" stroke-width="1" />
  <rect x="1" y="1" width="898" height="128" rx="14" fill="url(#ambientGlow)" />

  <!-- Minimalist Status Dot -->
  <circle cx="36" cy="30" r="4.5" fill="#30363d" />
  <circle cx="36" cy="30" r="3" fill="#238636" />
  <text x="48" y="34" class="sub" style="font-size: 11.5px; fill: #8b949e;">AVAILABLE FOR COLLABORATION</text>

  <!-- Title Text -->
  <text x="36" y="72" class="title">Hi, I'm Aditthan J K 👋</text>

  <!-- Subtitle -->
  <text x="36" y="96" class="sub">Pre-Final Year Undergrad • Artificial Intelligence &amp; Machine Learning</text>

  <!-- Bottom Tagline -->
  <text x="36" y="116" class="tag"># Built for Engineering, Wired for Business.</text>

  <!-- Clean Top-Right Badge -->
  <rect x="760" y="24" width="104" height="26" rx="13" fill="#21262d" stroke="#30363d" stroke-width="1" />
  <text x="812" y="41" text-anchor="middle" class="badge-text">AI / ML FOCUS</text>
</svg>
