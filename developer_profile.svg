<svg width="100%" height="290" viewBox="0 0 580 290" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Obsidian Matte Background -->
    <linearGradient id="obsidianCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Glassmorphism Hairline Border -->
    <linearGradient id="obsidianBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>
  </defs>

  <style>
    .window-title {
      font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 500;
      font-size: 11px;
      fill: #8b949e;
    }
    .code-font {
      font-family: 'Fira Code', 'Cascadia Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11.5px;
      line-height: 1.45;
    }
    .b-bracket { fill: #8b949e; font-weight: 600; }
    .b-key { fill: #79c0ff; font-weight: 500; }
    .b-val { fill: #a5d6ff; }
    .b-array { fill: #7ee787; }
    .b-punct { fill: #8b949e; }
  </style>

  <!-- Container Box with Rounded Glass Corners -->
  <rect x="1" y="1" width="578" height="288" rx="14" fill="url(#obsidianCard)" stroke="url(#obsidianBorder)" stroke-width="1" />

  <!-- Terminal Window Header Bar -->
  <path d="M 1 15 C 1 7.27 7.27 1 15 1 L 565 1 C 572.73 1 579 7.27 579 15 L 579 34 L 1 34 Z" fill="#161b22" />
  <line x1="1" y1="34" x2="579" y2="34" stroke="#21262d" stroke-width="1" />

  <!-- Subtle Window Controls -->
  <circle cx="20" cy="18" r="4.5" fill="#30363d" />
  <circle cx="34" cy="18" r="4.5" fill="#30363d" />
  <circle cx="48" cy="18" r="4.5" fill="#30363d" />

  <!-- Window Header Title -->
  <text x="70" y="22" class="window-title">profile.json — Aditthan-07</text>

  <!-- JSON Code Lines -->
  <g class="code-font" transform="translate(22, 56)">
    <!-- Line 1: { -->
    <text x="0" y="0" class="b-bracket">{</text>

    <!-- Line 2: "developer": "Aditthan J K", -->
    <text x="18" y="20">
      <tspan class="b-key">"developer"</tspan><tspan class="b-punct">: </tspan><tspan class="b-val">"Aditthan J K"</tspan><tspan class="b-punct">,</tspan>
    </text>

    <!-- Line 3: "status": "Pre-Final Year Undergrad (AI & ML)", -->
    <text x="18" y="40">
      <tspan class="b-key">"status"</tspan><tspan class="b-punct">: </tspan><tspan class="b-val">"Pre-Final Year (AI &amp; ML)"</tspan><tspan class="b-punct">,</tspan>
    </text>

    <!-- Line 4: "focus_areas": [ -->
    <text x="18" y="60">
      <tspan class="b-key">"focus_areas"</tspan><tspan class="b-punct">: [</tspan>
    </text>
    <text x="36" y="80">
      <tspan class="b-array">"Deep Learning"</tspan><tspan class="b-punct">, </tspan><tspan class="b-array">"Computer Vision"</tspan><tspan class="b-punct">, </tspan><tspan class="b-array">"Time-Series"</tspan>
    </text>
    <text x="18" y="100">
      <tspan class="b-punct">],</tspan>
    </text>

    <!-- Line 5: "current_endeavors": [ -->
    <text x="18" y="120">
      <tspan class="b-key">"current_endeavors"</tspan><tspan class="b-punct">: [</tspan>
    </text>
    <text x="36" y="140">
      <tspan class="b-array">"Agentic AI Frameworks"</tspan><tspan class="b-punct">, </tspan><tspan class="b-array">"Quant Modeling"</tspan>
    </text>
    <text x="18" y="160">
      <tspan class="b-punct">],</tspan>
    </text>

    <!-- Line 6: "philosophy": "Built for Engineering, Wired for Business.", -->
    <text x="18" y="180">
      <tspan class="b-key">"philosophy"</tspan><tspan class="b-punct">: </tspan><tspan class="b-val">"Built for Engineering, Wired for Business."</tspan><tspan class="b-punct">,</tspan>
    </text>

    <!-- Line 7: "contact": "aditthanjeganathan067@gmail.com" -->
    <text x="18" y="200">
      <tspan class="b-key">"contact"</tspan><tspan class="b-punct">: </tspan><tspan class="b-val">"aditthanjeganathan067@gmail.com"</tspan>
    </text>

    <!-- Line 8: } -->
    <text x="0" y="220" class="b-bracket">}</text>
  </g>
</svg>
