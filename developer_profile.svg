<svg width="100%" height="290" viewBox="0 0 580 290" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="60%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Effect -->
    <linearGradient id="termGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .term-title {
      font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 500;
      font-size: 11.5px;
      fill: #94a3b8;
    }
    .code-line {
      font-family: 'Fira Code', 'Cascadia Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11.5px;
      line-height: 1.45;
    }
    .bracket { fill: #f8fafc; font-weight: 700; }
    .key { fill: #38bdf8; font-weight: 600; }
    .val-string { fill: #4ade80; }
    .val-array { fill: #facc15; }
    .punct { fill: #94a3b8; }
  </style>

  <!-- Container Box with Rounded Corners -->
  <rect x="2" y="2" width="576" height="286" rx="14" fill="url(#termBg)" stroke="url(#termBorder)" stroke-width="1.5" />

  <!-- Terminal Window Header Bar -->
  <path d="M 2 16 C 2 8.27 8.27 2 16 2 L 564 2 C 571.73 2 578 8.27 578 16 L 578 34 L 2 34 Z" fill="#0b1120" />
  <line x1="2" y1="34" x2="578" y2="34" stroke="#334155" stroke-width="1" />

  <!-- Terminal Window Dots -->
  <circle cx="20" cy="18" r="4.5" fill="#ef4444" />
  <circle cx="34" cy="18" r="4.5" fill="#eab308" />
  <circle cx="48" cy="18" r="4.5" fill="#22c55e" />

  <!-- Terminal Header Title -->
  <text x="70" y="22" class="term-title">aditthan@dev-machine: ~/profile.json</text>

  <!-- JSON Code Lines -->
  <g class="code-line" transform="translate(20, 56)">
    <!-- Line 1: { -->
    <text x="0" y="0" class="bracket">{</text>

    <!-- Line 2: "developer": "Aditthan J K", -->
    <text x="18" y="20">
      <tspan class="key">"developer"</tspan><tspan class="punct">: </tspan><tspan class="val-string">"Aditthan J K"</tspan><tspan class="punct">,</tspan>
    </text>

    <!-- Line 3: "status": "Pre-Final Year Undergrad (AI & ML)", -->
    <text x="18" y="40">
      <tspan class="key">"status"</tspan><tspan class="punct">: </tspan><tspan class="val-string">"Pre-Final Year (AI &amp; ML)"</tspan><tspan class="punct">,</tspan>
    </text>

    <!-- Line 4: "focus_areas": [ -->
    <text x="18" y="60">
      <tspan class="key">"focus_areas"</tspan><tspan class="punct">: [</tspan>
    </text>
    <text x="36" y="80">
      <tspan class="val-array">"Deep Learning"</tspan><tspan class="punct">, </tspan><tspan class="val-array">"Computer Vision"</tspan><tspan class="punct">, </tspan><tspan class="val-array">"Time-Series"</tspan>
    </text>
    <text x="18" y="100">
      <tspan class="punct">],</tspan>
    </text>

    <!-- Line 5: "current_endeavors": [ -->
    <text x="18" y="120">
      <tspan class="key">"current_endeavors"</tspan><tspan class="punct">: [</tspan>
    </text>
    <text x="36" y="140">
      <tspan class="val-array">"Agentic AI Frameworks"</tspan><tspan class="punct">, </tspan><tspan class="val-array">"Quant Modeling"</tspan>
    </text>
    <text x="18" y="160">
      <tspan class="punct">],</tspan>
    </text>

    <!-- Line 6: "philosophy": "Built for Engineering, Wired for Business.", -->
    <text x="18" y="180">
      <tspan class="key">"philosophy"</tspan><tspan class="punct">: </tspan><tspan class="val-string">"Built for Engineering, Wired for Business."</tspan><tspan class="punct">,</tspan>
    </text>

    <!-- Line 7: "contact": "aditthanjeganathan067@gmail.com" -->
    <text x="18" y="200">
      <tspan class="key">"contact"</tspan><tspan class="punct">: </tspan><tspan class="val-string">"aditthanjeganathan067@gmail.com"</tspan>
    </text>

    <!-- Line 8: } -->
    <text x="0" y="220" class="bracket">}</text>
  </g>

  <!-- Glowing Corner Circuit Accent -->
  <circle cx="530" cy="240" r="60" fill="url(#termGlow)" />
  <path d="M 500 220 L 560 220 M 500 245 L 560 245 M 500 270 L 560 270" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1" />
  <path d="M 520 200 L 520 280 M 545 200 L 545 280" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1" />
</svg>
