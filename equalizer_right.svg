<svg width="280" height="180" viewBox="0 0 280" 180 fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Equalizer Spectrum Gradient -->
    <linearGradient id="spectrumR" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowR" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseBar1R { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(0.95); } }
    @keyframes pulseBar2R { 0%, 100% { transform: scaleY(0.15); } 50% { transform: scaleY(0.75); } }
    @keyframes pulseBar3R { 0%, 100% { transform: scaleY(0.5); } 50% { transform: scaleY(1.0); } }
    @keyframes pulseBar4R { 0%, 100% { transform: scaleY(0.2); } 50% { transform: scaleY(0.8); } }
    @keyframes pulseBar5R { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(0.9); } }

    .r1 { transform-origin: bottom; animation: pulseBar1R 0.7s ease-in-out infinite alternate; }
    .r2 { transform-origin: bottom; animation: pulseBar2R 0.95s ease-in-out infinite alternate; }
    .r3 { transform-origin: bottom; animation: pulseBar3R 0.6s ease-in-out infinite alternate; }
    .r4 { transform-origin: bottom; animation: pulseBar4R 1.05s ease-in-out infinite alternate; }
    .r5 { transform-origin: bottom; animation: pulseBar5R 0.8s ease-in-out infinite alternate; }

    .labelR {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      fill: #38bdf8;
      font-weight: 600;
      letter-spacing: 1px;
    }
  </style>

  <!-- Background Frame -->
  <rect x="2" y="2" width="276" height="176" rx="12" fill="#080c14" stroke="#1e293b" stroke-width="1" />
  
  <!-- Subtle Grid Lines -->
  <line x1="20" y1="50" x2="260" y2="50" stroke="#334155" stroke-dasharray="3 3" opacity="0.4" />
  <line x1="20" y1="90" x2="260" y2="90" stroke="#334155" stroke-dasharray="3 3" opacity="0.4" />
  <line x1="20" y1="130" x2="260" y2="130" stroke="#334155" stroke-dasharray="3 3" opacity="0.4" />

  <!-- Channel Label -->
  <text x="22" y="28" class="labelR">AUDIO_SPECTRUM_R ▶</text>

  <!-- Equalizer Bars Group -->
  <g transform="translate(25, 150)" filter="url(#glowR)">
    <!-- 12 Animated Spectrum Bars -->
    <rect x="0"   y="-100" width="12" height="100" rx="3" fill="url(#spectrumR)" class="r3" />
    <rect x="18"  y="-100" width="12" height="100" rx="3" fill="url(#spectrumR)" class="r1" />
    <rect x="36"  y="-100" width="12" height="100" rx="3" fill="url(#spectrumR)" class="r5" />
    <rect x="54"  y="-100" width="12" height="100" rx="3" fill="url(#spectrumR)" class="r2" />
    <rect x="72"  y="-100" width="12" height="100" rx="3" fill="url(#spectrumR)" class="r4" />
    <rect x="90"  y="-100" width="12" height="100" rx="3" fill="url(#spectrumR)" class="r1" />
    <rect x="108" y="-100" width="12" height="100" rx="3" fill="url(#spectrumR)" class="r3" />
    <rect x="126" y="-100" width="12" height="100" rx="3" fill="url(#spectrumR)" class="r5" />
    <rect x="144" y="-100" width="12" height="100" rx="3" fill="url(#spectrumR)" class="r2" />
    <rect x="162" y="-100" width="12" height="100" rx="3" fill="url(#spectrumR)" class="r4" />
    <rect x="180" y="-100" width="12" height="100" rx="3" fill="url(#spectrumR)" class="r1" />
    <rect x="198" y="-100" width="12" height="100" rx="3" fill="url(#spectrumR)" class="r3" />
    <rect x="216" y="-100" width="12" height="100" rx="3" fill="url(#spectrumR)" class="r5" />
  </g>
</svg>
