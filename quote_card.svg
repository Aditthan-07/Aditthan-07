<svg width="100%" height="80" viewBox="0 0 900 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="quoteBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Glassmorphism Hairline Border -->
    <linearGradient id="quoteBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>
  </defs>

  <style>
    .quote-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-size: 17px;
      font-weight: 600;
      fill: #f0f6fc;
      letter-spacing: 0.3px;
    }
    .quote-mark {
      font-family: Georgia, serif;
      font-size: 24px;
      fill: #58a6ff;
      font-weight: 700;
    }
  </style>

  <!-- Container Box matching Obsidian Palette -->
  <rect x="1" y="1" width="898" height="78" rx="12" fill="url(#quoteBg)" stroke="url(#quoteBorder)" stroke-width="1" />

  <!-- Centered Quote -->
  <text x="450" y="47" text-anchor="middle" class="quote-text">
    <tspan class="quote-mark">“</tspan> Engineering builds the product. Business scales the impact. <tspan class="quote-mark">”</tspan>
  </text>
</svg>
